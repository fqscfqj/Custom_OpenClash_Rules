# ============================================================
# Custom_Clash_Base_IPv6 — OpenClash IPv6 基础模板
# 目标形态：国内服务走运营商原生 IPv6，翻墙流量一律走 IPv4 代理
# 所有参数均通过 OpenClash Web 界面(UCI) + 此模板原生管理
# mixed-port 由 OpenClash UCI 控制 (openclash.config.mixed_port)
#
# 实测行为（Mihomo alpha-g88dcbf7 / OpenClash 0.47.168，2026-10 验证）：
#   ipv6: true + dns.ipv6: true + 不写 fake-ip-range6
#     → 命中 fake-ip-filter 的国内域名：返回真实 A + 真实 AAAA（原生 IPv6 直连）
#     → 未命中的境外域名：返回 198.18.x.x fake IPv4，AAAA 为空
#       （终端只能走 IPv4 → 透明代理 → 节点 IPv4 出口）
#   缺少 ipv6: true 或 dns.ipv6: true 时，AAAA 会被整体清空，国内也会失去 IPv6。
#   因此这两个值必须同时为 true（OpenClash 勾选「IPv6 DNS Resolve」即可）。
#
# 防回归约束：
#   - 绝对不要设置 fake-ip-range6。一旦设置，境外域名会返回无法路由的 fake IPv6
#     （fd00::x / fdfe:dcba:9876::x），终端优先尝试该地址导致卡顿或直连失败。
#   - 部分版本内核连 `fake-ip-range6: fdfe:dcba:9876::1/126`（文档里的默认写法）
#     都会解析失败并报 `ipnet don't have valid ip`，直接导致内核无法启动。
# ============================================================
allow-lan: true
mode: rule
log-level: error
external-controller: 0.0.0.0:9090
ipv6: true

# 以下参数在 OpenClash Web 界面无对应项，在此预设
keep-alive-idle: 600
geodata-mode: true
tcp-concurrent: true
unified-delay: true

# find-process-mode 有 OpenClash UCI 覆写项，基础模板故意不写入。
# 路由器环境请在 OpenClash 中明确选择 OFF；不要在此写 unquoted off，
# 避免 YAML 1.1/中间转换器将其解析为布尔 false，导致 Mihomo 配置失效。

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 故意不写 fake-ip-range6：IPv6 必须解析成真实地址，走运营商原生 IPv6 出口。
  # OpenClash 会在此列表里自动加入 rule-set:oc-cn-domain（国内域名 → 真实 IP），
  # 这正是“国内域名能拿到真实 AAAA”的前提；不要删除该自动注入项。
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
    - "+.mi.com"
    - "+.srv.nintendo.net"
    - "+.battle.net"
    - "*.blizzard.net"
    - "+.ts.net"
    - "*.tailscale.com"
    - "www.gstatic.com"
    - "fonts.gstatic.com"
    - "+.ddns.net"
    - "+.noip.com"
    - "+.ip6-localhost"
    - "+.ip6-loopback"
    - "*.ip6-localnet"
    - "+.ip6-mcastprefix"
  default-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  # 冷启动保护：节点/Provider 域名必须能在代理尚未建立时直连解析。
  # 不要把 default-nameserver、proxy-server-nameserver 改成依赖代理的 DoH，
  # 否则 Provider 缓存为空时可能形成 DNS/代理自举回环。
  proxy-server-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  nameserver:
    # 未命中 nameserver-policy 的域名也使用 DoH，避免回落到运营商明文 DNS。
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  # 目标已命中 DIRECT 时，使用国内 DNS 重新解析，避免境外 CDN 结果不稳定。
  direct-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  direct-nameserver-follow-policy: false
  # DNS 服务器域名本身仍由 default-nameserver 直连解析，避免自举回环。
  nameserver-policy:
    "geosite:private":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:cn":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:microsoft":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:apple":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:google":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "geosite:github":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "geosite:category-ai-!cn":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "geosite:gfw":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
    "geosite:geolocation-!cn":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
# 嗅探器:fake-ip 模式下还原 TLS SNI / HTTP Host,使基于域名的代理规则正常生效
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  skip-domain:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"

proxies: []
proxy-groups: []
rules: []
