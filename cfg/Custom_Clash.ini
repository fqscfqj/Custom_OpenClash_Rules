;2. 媒体/流媒体
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🔥 DMM,[]GEOSITE,dmm-porn
ruleset=🔥 DMM,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/DMM.yaml,28800
ruleset=🔥 E-Hentai,[]GEOSITE,ehentai
ruleset=🔥 PORN,[]GEOSITE,category-porn

;3. 个人/特定应用规则
