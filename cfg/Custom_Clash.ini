[custom]
;Clash 基础配置，补齐 DNS 防泄漏设置
clash_rule_base=https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/cfg/Custom_Clash_Base.yaml

;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;1. 本地/局域网/直连规则 (最高优先级)
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Direct_Classical_IP.yaml,28800

;广告拦截 — 只用精选规则集（几乎零误杀），不用 geosite 全量分类和泛关键字匹配
;ACL4SSR 广告联盟分流
ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/BanAD.yaml,86400
;ACL4SSR 中国区广告补充
ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/BanEasyListChina.yaml,86400
;ACL4SSR 隐私跟踪/行为分析/数据统计屏蔽
ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Providers/BanEasyPrivacy.yaml,86400
;反劫持: 运营商劫持/恶意跳转域名
ruleset=🛑 广告拦截,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hijacking/Hijacking.yaml,86400

ruleset=⬇️ 下载专用,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/Download.yaml,28800

ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🤖 AI服务,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/global-ai-api.yaml,28800
