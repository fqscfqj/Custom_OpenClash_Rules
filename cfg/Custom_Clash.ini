ruleset=🎯 全球直连,[]GEOSITE,cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geoip:cn 作为国内 IP 兜底
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
;聚合分类(含国内域名)必须在 GEOSITE,cn / GEOIP,cn 之后,先由国内白名单兜底直连,剩余国外域名再走代理
ruleset=🚀 手动选择,[]GEOSITE,category-communication
ruleset=🚀 手动选择,[]GEOSITE,category-games
ruleset=🚀 手动选择,[]GEOSITE,category-entertainment
ruleset=🚀 手动选择,[]GEOSITE,category-ecommerce
;以上兜底规则会根据实际情况随时取消
;PT/BT 优化开启会使 80/443 以外端口的流量直连
;DNS/DoT/DoQ 常见端口必须优先代理，避免被端口直连规则放行造成泄露
ruleset=🚀 手动选择,[]DST-PORT,53
ruleset=🚀 手动选择,[]DST-PORT,784
ruleset=🚀 手动选择,[]DST-PORT,853
ruleset=🚀 手动选择,[]DST-PORT,8853
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/rule/Custom_Port_Direct.yaml,28800
;国内冷门域名可能命中漏网之鱼，如影响使用，可手动切换漏网之鱼为直连
;为降低 DNS 泄露测试误报，漏网之鱼默认走手动选择
ruleset=🐟 漏网之鱼,[]FINAL

