;策略组: 自动选择 (Url-Test)
;末尾的 `interval[,timeout][,tolerance]` 里只有 interval 与 tolerance 会写进 Clash 配置
;（timeout 被订阅转换丢弃）。而且 OpenClash 生成的是 `use: Provider_xxxx + filter:` 形式的组，
;组里的 interval 对 provider 节点无效——mihomo 只为内联 `proxies:` 建组级健康检查，
;provider 节点的探测周期由 provider 自己的 health-check.interval 决定（OpenClash 生成 300s，
;可用 `uci set openclash.config.urltest_interval_mod='120'` 统一改短，代价是探测流量）。
;真正影响掉线切换的：组级 tolerance、组级 max-failed-times 与 provider 的 health-check.timeout，
;后两项由 OpenClash 原生「覆写模块」cfg/overwrite/Custom_Clash.conf 在配置生成后注入，
;不再需要部署 ruby 脚本。详见 README「策略组自动切换」与「原生覆写模块」。
custom_proxy_group=♻️ 自动选择`url-test`^((?!下载专用|下载专享).)*$`https://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🏠 自建节点自动选择`url-test`(自建|自建专用|自建专享)`https://www.gstatic.com/generate_204`600,,50
;下载组：tolerance 20ms——延迟相近的两个节点不来回跳，明显更快的才切过去。
;下面这行让日本 S05/S06 也参与自动选择。204 探测只看握手快慢、看不出吞吐，
;实测这两个节点经常整轮探测都是 delay 0（不可用）而组仍停在其中之一；
;想让下载不落在它们身上，就换成注释里的那行（负向先行断言排除名字含“日本”的节点）：
custom_proxy_group=⬇️ 下载自动选择`url-test`(下载专用|下载专享)`https://www.gstatic.com/generate_204`30,,20
;custom_proxy_group=⬇️ 下载自动选择`url-test`^((?!日本).)*(下载专用|下载专享)`https://www.gstatic.com/generate_204`30,,20
