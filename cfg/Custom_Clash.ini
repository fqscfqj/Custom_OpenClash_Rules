[custom]
;本模板与 cfg/Custom_Clash_IPv6.ini 内容完全一致，两者只是订阅入口不同。
;IPv4/IPv6 的真正差异由路由器 UCI 决定（基础模板已合并为一份）：
;  openclash.config.ipv6_dns=0 → 顶层 ipv6 / dns.ipv6 均 false，AAAA 一律为空，国内外全走 IPv4
;  openclash.config.ipv6_dns=1 → yml_change.sh 强制写入 ipv6: true + dns.ipv6: true，
;                                实现“国内原生 IPv6 + 境外 IPv4 代理”（详见 README「IPv6 分流」）
;注意：ipv6_dns=1 时必须同时保持 openclash.config.ipv6_enable=0（IPv6 不进内核），
;      且「Fake-IP Range (IPv6 Cidr)」留空；该键的防回归删除由原生覆写模块
;      cfg/overwrite/Custom_Clash.conf 兜底（不再需要脚本）。
clash_rule_base=https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/cfg/Custom_Clash_Base.yaml

;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;1. 本地/局域网/直连规则 (最高优先级)
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;谷歌 Play 页面与 APK/CDN 会访问 googleapis.cn、gvt 和 xn--ngstr 等不同域名。
;必须在自定义直连规则之前强制代理，避免商店可浏览但应用无法下载。
ruleset=🚀 手动选择,[]GEOSITE,google-play
