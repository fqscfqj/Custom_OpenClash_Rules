; ==========================================================
; OpenClash 覆写模块 (Overwrite Module) —— Custom_Clash
; ==========================================================
; 用 OpenClash 原生「覆写模块」替代原来的
; script/openclash_custom_overwrite.sh（ruby 解析回写配置），
; 不再需要往路由器部署任何脚本。
;
; 语法：OpenClash 官方 res/overwrite/default + Wiki「覆写模块」。
; 段落：[General] 在 yml_change.sh 之前写 UCI；[YAML]/[Overwrite]
;       在 yml_change.sh / yml_rules_change.sh 之后合并，因此能覆盖
;       订阅转换与插件脚本的所有输出。
; 生效：只在 OpenClash 启动/重启时解析一次（reload 不会重跑）。
;
; 部署方式（二选一）：
;
;  A. LuCI（推荐，可自动更新）：
;     运行状态页 → 「覆写模块」按钮 → + 添加新模块 → 订阅链接 →
;     填入本文件 raw 地址 → 保存 → 重启 OpenClash。
;
;  B. 命令行（本地文件）：
;     curl -sSL -o /etc/openclash/overwrite/Custom_Clash \
;       https://raw.githubusercontent.com/fqscfqj/Custom_OpenClash_Rules/refs/heads/main/cfg/overwrite/Custom_Clash.conf
;     uci add openclash config_overwrite
;     uci set openclash.@config_overwrite[-1].name='Custom_Clash'
;     uci set openclash.@config_overwrite[-1].type='file'
;     uci set openclash.@config_overwrite[-1].enable='1'
;     uci set openclash.@config_overwrite[-1].order='3'
;     uci add_list openclash.@config_overwrite[-1].config='all'
;     uci commit openclash && /etc/init.d/openclash restart
;
; 检查是否生效：grep -n 'Overwrite Module' /tmp/openclash.log
; ==========================================================

[YAML]

# ----------------------------------------------------------
# 1) 防回归：删除 dns.fake-ip-range6
#    该键一旦有值，境外域名会拿到无法路由的 fake IPv6（fd00::x），
#    终端优先尝试它 → 卡顿或直连失败，破坏“境外走 IPv4 代理”。
#    `key-` 是覆写模块的“删键”操作符，等价于原脚本的 sed 删行。
# ----------------------------------------------------------
dns:
  fake-ip-range6-:

# ----------------------------------------------------------
# 2) 自动选择组掉线切换加固
#    OpenClash 生成的是 `use: Provider_xxxx` 形式的 url-test 组，
#    组自己的 interval / timeout / lazy 对 provider 节点无效；
#    真正影响“掉线后多久切走”的是 max-failed-times：
#    连续 2 次拨号失败（默认 5 次）即强制触发一次健康检查。
#    lazy: false / timeout: 3000 对 provider 型组是空操作，
#    但换成内联 proxies: 模板时生效，属于无害的前瞻设置。
# ----------------------------------------------------------
proxy-groups*:
  where:
    name: '/下载自动选择/'
  set:
    max-failed-times: 2
    lazy: false
    timeout: 3000

# ----------------------------------------------------------
# 3) proxy-provider 健康检查超时 5000 → 3000ms
#    强制健康检查时更快把死节点判定为不可用。
#    provider 的探测周期仍由 OpenClash 的 urltest_interval_mod 决定。
#    where.key 匹配 provider 名字（OpenClash 生成为 Provider_XXXXXX）。
# ----------------------------------------------------------
proxy-providers*:
  where:
    key: '/Provider_/'
  set:
    health-check:
      timeout: 3000
