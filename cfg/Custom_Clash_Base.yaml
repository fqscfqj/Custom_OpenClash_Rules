mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
# 保留国内 IPv6 时，需要在 OpenClash 覆写里同步开启 IPv6 / IPv6 DNS / China IPv6 Route。
ipv6: true

# === 性能优化 ===
# TCP 并发：同一域名多条连接并行建立，加速页面加载
tcp-concurrent: true
# 统一延迟：将节点延迟检测合并为一次，减少不必要的健康检查
unified-delay: true
# 保持连接空闲超时（秒），减少 TLS 握手次数
keep-alive-idle: 600
# 客户端指纹伪装为 Chrome，避免被 CDN 识别为异常流量而限速/拦截
global-client-fingerprint: chrome
# 使用 mihomo 内置 geo 数据，更新更快
geodata-mode: true
geodata-loader: memconservative

# === 持久化 ===
profile:
  store-selected: true
  store-fake-ip: true

# === SNI 嗅探 ===
# 关键：对 TLS 流量进行 SNI 嗅探，识别图片 CDN 等未命中规则的域名真实目标
# 解决"首次访问图片加载不出"的核心修复
sniffer:
  enable: true
  sniffing:
    - tls
    - http
  port-whitelist:
    - 80
    - 443
    - 8080
    - 8443
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  force-dns-mapping: true
  parse-pure-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
  # 仅用于引导解析 DoH 域名，本身不是最终上游；若极度在意隐私暴露，可改为自建/更信任的引导 DNS。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 代理节点域名必须能在直连状态下解析，否则会出现解析代理节点时的回环问题。
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  nameserver-policy:
    "geosite:private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:gfw":
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - ::/128
      - ::1/128
      - 2001::/32
      - 240.0.0.0/4
      - 0.0.0.0/32

proxies: []
proxy-groups: []
rules: []
