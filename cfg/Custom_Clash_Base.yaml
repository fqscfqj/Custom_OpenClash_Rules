# ============================================================
# Custom_Clash_Base — OpenClash 基础模板
# 所有参数均通过 OpenClash Web 界面(UCI) + 此模板原生管理
# 不再需要 custom_overwrite.sh
# ============================================================
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
ipv6: true

# 以下参数在 OpenClash Web 界面无对应项，在此预设
keep-alive-idle: 600
geodata-mode: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  nameserver-policy:
    "geosite:private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:gfw":
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://1.0.0.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - ::/128
      - ::1/128
      - 2001::/32
      - 240.0.0.0/4
      - 0.0.0.0/32

proxies: []
proxy-groups: []
rules: []
