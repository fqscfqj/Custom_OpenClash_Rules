# ============================================================
# Custom_Clash_Base — OpenClash 基础模板
# 所有参数均通过 OpenClash Web 界面(UCI) + 此模板原生管理
# 不再需要 custom_overwrite.sh
# mixed-port 由 OpenClash UCI 控制 (openclash.config.mixed_port)
# ============================================================
allow-lan: true
mode: rule
log-level: error
external-controller: 0.0.0.0:9090
ipv6: true

# 以下参数在 OpenClash Web 界面无对应项，在此预设
keep-alive-idle: 600
geodata-mode: true
tcp-concurrent: true
unified-delay: true

# find-process-mode 有 OpenClash UCI 覆写项，基础模板故意不写入。
# 路由器环境请在 OpenClash 中明确选择 OFF；不要在此写 unquoted off，
# 避免 YAML 1.1/中间转换器将其解析为布尔 false，导致 Mihomo 配置失效。

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Deliberately omit fake-ip-range6: IPv6 must resolve to real addresses
  # and go out through the ISP's native IPv6 route.
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
    - "+.mi.com"
    - "+.srv.nintendo.net"
    - "+.battle.net"
    - "*.blizzard.net"
    - "+.ts.net"
    - "*.tailscale.com"
    - "www.gstatic.com"
    - "fonts.gstatic.com"
    - "+.ddns.net"
    - "+.noip.com"
    - "+.ip6-localhost"
    - "+.ip6-loopback"
    - "*.ip6-localnet"
    - "+.ip6-mcastprefix"
  default-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  # 冷启动保护：节点/Provider 域名必须能在代理尚未建立时直连解析。
  # 不要把 default-nameserver、proxy-server-nameserver 改成依赖代理的 DoH，
  # 否则 Provider 缓存为空时可能形成 DNS/代理自举回环。
  proxy-server-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  nameserver:
    - 202.102.152.3
    - 223.5.5.5
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  nameserver-policy:
    "geosite:private":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:cn":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:microsoft":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:apple":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:google":
      - 1.1.1.1
      - 8.8.8.8
    "geosite:github":
      - 1.1.1.1
      - 8.8.8.8
    "geosite:category-ai-!cn":
      - 1.1.1.1
      - 8.8.8.8
    "geosite:gfw":
      - 1.1.1.1
      - 8.8.8.8
    "geosite:geolocation-!cn":
      - 1.1.1.1
      - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - geolocation-cn
    ipcidr:
      - 0.0.0.0/32
      - 240.0.0.0/4
      - ::/128

# 嗅探器:fake-ip 模式下还原 TLS SNI / HTTP Host,使基于域名的代理规则正常生效
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  skip-domain:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"

proxies: []
proxy-groups: []
rules: []
