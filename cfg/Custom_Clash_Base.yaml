# ============================================================
# Custom_Clash_Base — OpenClash 基础模板
# 所有参数均通过 OpenClash Web 界面(UCI) + 此模板原生管理
# 不再需要 custom_overwrite.sh
# mixed-port 由 OpenClash UCI 控制 (openclash.config.mixed_port)
# ============================================================
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
ipv6: true

# 以下参数在 OpenClash Web 界面无对应项，在此预设
keep-alive-idle: 600
geodata-mode: true
tcp-concurrent: true
find-process-mode: "off"
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
    - "+.mi.com"
    - "+.srv.nintendo.net"
    - "+.battle.net"
    - "*.blizzard.net"
    - "+.ts.net"
    - "*.tailscale.com"
    - "www.gstatic.com"
    - "fonts.gstatic.com"
    - "+.ddns.net"
    - "+.noip.com"
    - "+.ip6-localhost"
    - "+.ip6-loopback"
    - "*.ip6-localnet"
    - "+.ip6-mcastprefix"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:microsoft":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:apple":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:google":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:github":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:category-ai-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:gfw":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 0.0.0.0/32
      - 240.0.0.0/4
      - ::/128

# 嗅探器:fake-ip 模式下还原 TLS SNI / HTTP Host,使基于域名的代理规则正常生效
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  skip-domain:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"

proxies: []
proxy-groups: []
rules: []
