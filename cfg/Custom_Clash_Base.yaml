# ============================================================
# Custom_Clash_Base — OpenClash 基础模板（IPv4-only / IPv6 通用）
# 所有参数均通过 OpenClash Web 界面(UCI) + 此模板原生管理
# mixed-port 由 OpenClash UCI 控制 (openclash.config.mixed_port)
#
# 本文件是唯一的基础模板，cfg/Custom_Clash.ini 与
# cfg/Custom_Clash_IPv6.ini 都引用它：两者的 IPv4/IPv6 行为差异
# 完全由路由器 UCI 决定，模板本身不需要分两份。
#
#   ipv6_dns=0（默认）→ yml_change.sh 写入 dns.ipv6: false，
#                       顶层 ipv6 保持本文件的 false；AAAA 全部为空，国内外全走 IPv4。
#   ipv6_dns=1        → yml_change.sh 强制写入 dns.ipv6: true 与 ipv6: true，
#                       实现“国内原生 IPv6 + 境外 IPv4 代理”（详见 README「IPv6 分流」）。
#   两条硬约束（缺一 AAAA 会被整体清空，国内也失去 IPv6）：
#     dns.ipv6 与顶层 ipv6 必须同时为 true；
#     绝对不要设置 dns.fake-ip-range6（境外会拿到无法路由的 fake IPv6）。
#   fake-ip-range6 的防回归删除由原生覆写模块
#   cfg/overwrite/Custom_Clash.conf 兜底（不再需要部署脚本）。
# ============================================================
allow-lan: true
mode: rule
log-level: error
external-controller: 0.0.0.0:9090
ipv6: false

# 以下参数在 OpenClash Web 界面无对应项，在此预设
keep-alive-idle: 600
geodata-mode: true
tcp-concurrent: true
unified-delay: true

# find-process-mode 有 OpenClash UCI 覆写项，基础模板故意不写入。
# 路由器环境请在 OpenClash 中明确选择 OFF；不要在此写 unquoted off，
# 避免 YAML 1.1/中间转换器将其解析为布尔 false，导致 Mihomo 配置失效。

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 故意不写 fake-ip-range6：IPv6 必须解析成真实地址，走运营商原生 IPv6 出口。
  # 一旦该键有值，境外域名会拿到无法路由的 fake IPv6（fd00::x），终端优先尝试它
  # 导致卡顿或直连失败；OpenClash 覆写里的「Fake-IP Range (IPv6 Cidr)」请保持留空，
  # 防回归删除由原生覆写模块 cfg/overwrite/Custom_Clash.conf 兜底。
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.localhost"
    - "*.home.arpa"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "+.pool.ntp.org"
    - "time1.cloud.tencent.com"
    - "+.market.xiaomi.com"
    - "+.mi.com"
    - "+.srv.nintendo.net"
    - "+.battle.net"
    - "*.blizzard.net"
    - "+.ts.net"
    - "*.tailscale.com"
    - "www.gstatic.com"
    - "fonts.gstatic.com"
    - "+.ddns.net"
    - "+.noip.com"
    - "+.ip6-localhost"
    - "+.ip6-loopback"
    - "*.ip6-localnet"
    - "+.ip6-mcastprefix"
    # 需要真实公网 IP 的域名：客户端自带 SSRF/公网 IP 校验时（如 DeepSeek Harness
    # 的 web-fetch、部分爬虫/MCP 工具）会拒绝 fake-IP 198.18.0.0/16 而直接报错。
    # 这些域名放行真实解析，流量仍由 SNI 嗅探命中域名规则走代理，不影响分流。
    - "+.github.com"
    - "+.githubusercontent.com"
    - "+.githubassets.com"
    - "+.tavily.com"
  default-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  # 冷启动保护：节点/Provider 域名必须能在代理尚未建立时直连解析。
  # 不要把 default-nameserver、proxy-server-nameserver 改成依赖代理的 DoH，
  # 否则 Provider 缓存为空时可能形成 DNS/代理自举回环。
  proxy-server-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  nameserver:
    # 未命中 nameserver-policy 的域名也使用 DoH，避免回落到运营商明文 DNS。
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # 目标已命中 DIRECT 时，使用国内 DNS 重新解析，避免境外 CDN 结果不稳定。
  direct-nameserver:
    - 202.102.152.3
    - 223.5.5.5
  direct-nameserver-follow-policy: false
  # DNS 服务器域名本身仍由 default-nameserver 直连解析，避免自举回环。
  nameserver-policy:
    "geosite:private":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:cn":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:microsoft":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:apple":
      - 202.102.152.3
      - 223.5.5.5
    "geosite:google":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:github":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:category-ai-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:gfw":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
# 嗅探器:fake-ip 模式下还原 TLS SNI / HTTP Host,使基于域名的代理规则正常生效
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
  skip-domain:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"

proxies: []
proxy-groups: []
rules: []
